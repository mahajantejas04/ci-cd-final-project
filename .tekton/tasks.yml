
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" \
          -mindepth 1 -maxdepth 1 \
          -exec rm -rf {} +

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        python -m pip install nose
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi
        nosetests
